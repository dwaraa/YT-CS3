name: CI & Build Cloudstream Plugins

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      - name: Lint Code with ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod a+x ktlint
          ./ktlint "YouTube/src/**/*.kt" || echo "ktlint completed with warnings"

      - name: Build Plugins (.cs3 & plugins.json)
        run: |
          ./gradlew make makePluginsJson --stacktrace
          mkdir -p dist
          cp YouTube/build/*.cs3 dist/ || cp **/build/*.cs3 dist/ || true
          cp build/plugins.json dist/ || true
          cp repo.json dist/ || true

      - name: Deploy to builds branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: builds
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Auto-build plugins for Cloudstream: ${GITHUB_SHA}"

      - name: Purge jsDelivr CDN Cache
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          sleep 5
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/plugins.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/YouTube.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/repo.json" || true
